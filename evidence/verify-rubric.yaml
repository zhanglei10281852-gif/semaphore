rubrics:
  - id: 1
    type: f2p
    text: 导出期间并发重命名、删除或重新绑定模板及其仓库、清单、变量组等引用时，成功 JSON 只呈现变更前或变更后的完整关系，不出现混合版本。
  - id: 2
    type: f2p
    text: 模板保险库和角色、集成别名与匹配规则等嵌套对象与各自父对象来自同一快照，不会产生孤立子项、漏项或指向另一代父对象。
  - id: 3
    type: f2p
    text: 计划及其任务参数、项目角色、Runner 和外部密钥存储等较晚读取的资源与前面读取的模板、清单和凭据保持同一提交视图。
  - id: 4
    type: f2p
    text: 任一主存储或嵌套对象读取失败时不发送成功的部分 JSON，也不产生成功导出审计；故障消失后重试可得到一份完整文件。
  - id: 5
    type: f2p
    text: 成功备份中的必需名称引用均能通过现有校验并恢复，快照异常造成的缺失引用会阻止成功导出，而合法可选引用仍按旧格式处理。
  - id: 6
    type: p2p
    text: 没有并发修改时，现有项目资源、字段命名、数组结构、名称映射和任务临时密钥等敏感内部数据的排除规则保持兼容。
  - id: 7
    type: p2p
    text: 固定版本可接受的旧备份仍可导入，且新导出的完整文件能按既有恢复入口重建等价项目而不引入额外资源。
