rubrics:
  - id: 1
    type: f2p
    text: 全局或项目 Runner 的清理请求具有可持久识别的状态，直到收到匹配的成功确认前都不会因一次心跳或轮询而被视为完成。
  - id: 2
    type: f2p
    text: 处于待清理或清理中的 Runner 不再接收新任务；匹配任务可在其他可用 Runner 上执行或保持等待，普通 Runner 调度不受影响。
  - id: 3
    type: f2p
    text: Runner 有活动作业时不会删除其仓库、清单、HOME 或其他执行资源，现有作业可继续上报并结束，最后一个相关作业释放后才开始清理。
  - id: 4
    type: f2p
    text: 目录删除部分失败时请求进入可观察的失败待重试状态，不终止任务、不提前恢复接单；后续重试只在成功删除后确认完成。
  - id: 5
    type: f2p
    text: Runner 或服务端在等待、清理或确认前重启后仍能继续同一请求，重复轮询与旧请求的迟到确认不会完成较新的清理。
  - id: 6
    type: f2p
    text: API 或管理界面能观察等待作业、正在清理、失败待重试和已完成，且成功审计只在 Runner 确认实际完成时产生一次。
  - id: 7
    type: p2p
    text: 无活动作业的清理保持快速路径，项目 Runner 仅清所属项目目录、全局 Runner 仍清全部缓存，普通轮询、进度上报和缓存复用行为保持兼容。
